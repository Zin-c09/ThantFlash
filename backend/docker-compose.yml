services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thantflash
      POSTGRES_USER: thantflash
      POSTGRES_PASSWORD: thantflash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thantflash"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/thantflash
      DB_USER: thantflash
      DB_PASSWORD: thantflash
      JWT_SECRET: ${JWT_SECRET:-please-set-a-long-random-secret-in-env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
