spring:
  application:
    name: thantflash-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thantflash}
    username: ${DB_USER:thantflash}
    password: ${DB_PASSWORD:thantflash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB

thantflash:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-only-a-dev-secret}
    ttl: 12h
  reminders:
    poll-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
