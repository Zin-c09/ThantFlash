name: Server CI

on:
  push:
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
